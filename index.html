<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>蚊取り線香</title>

  <style>
    :root {
      --night: #091b2b;
      --night-light: #102b3d;
      --green: #5d9b65;
      --green-dark: #37643e;
      --ember: #ff6044;
      --ash: #263b32;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      color: #eef7ee;
      font-family:
        "Yu Gothic", "Hiragino Kaku Gothic ProN",
        system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 42%, #173c4b 0%, transparent 34%),
        linear-gradient(145deg, var(--night), #06111e 75%);
    }

    .app {
      width: min(92vw, 680px);
      margin: 24px 0;
      padding: 34px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      border: 1px solid rgba(180, 230, 190, 0.13);
      border-radius: 28px;
      background: rgba(8, 26, 39, 0.58);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.35),
        inset 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
    }

    header {
      text-align: center;
    }

    h1 {
      margin: 0;
      letter-spacing: 0.18em;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      font-weight: 500;
    }

    .subtitle {
      margin: 10px 0 0;
      color: #a8c7b0;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
    }

    .stage {
      position: relative;
      width: min(82vw, 430px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transform: rotate(0deg);
      transform-origin: 22% 88%;
      transition: transform 0.2s ease;
    }

    .stand {
      position: absolute;
      left: 8%;
      bottom: 6%;
      width: 34%;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0.45) 0%,
        rgba(0, 0, 0, 0.18) 55%,
        transparent 80%
      );
      transform: rotate(0deg);
      transition: transform 0.2s ease;
    }

    .glow {
      position: absolute;
      width: 72%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(72, 153, 95, 0.12);
      filter: blur(38px);
    }

    canvas {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .smoke {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .smoke-particle {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      filter: blur(4px);
      animation: smoke-rise 2.8s ease-out forwards;
    }

    @keyframes smoke-rise {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.45);
      }
      18% {
        opacity: 0.6;
      }
      100% {
        opacity: 0;
        transform:
          translate(var(--drift), -95px)
          scale(2.5);
      }
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      min-width: 128px;
      padding: 12px 22px;
      border: 1px solid rgba(190, 235, 195, 0.24);
      border-radius: 999px;
      color: #edf9ed;
      background: rgba(76, 126, 83, 0.42);
      cursor: pointer;
      font: inherit;
      transition: 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: rgba(96, 157, 101, 0.62);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
    }

    #resetButton {
      background: rgba(70, 84, 83, 0.36);
    }

    .status {
      min-height: 1.4em;
      color: #abcab0;
      font-size: 0.84rem;
      letter-spacing: 0.08em;
    }

    .smoke-level {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: min(80vw, 320px);
    }

    .smoke-level label {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      color: #cfe6d2;
    }

    .smoke-level input[type="range"] {
      width: 100%;
      accent-color: #5d9b65;
      cursor: pointer;
    }

    .coil-color {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .coil-color label {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      color: #cfe6d2;
    }

    .coil-color input[type="color"] {
      width: 40px;
      height: 32px;
      padding: 0;
      border: 1px solid rgba(190, 235, 195, 0.24);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }

    .burn-time {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: min(80vw, 320px);
    }

    .burn-time label {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      color: #cfe6d2;
    }

    .burn-time input[type="range"] {
      width: 100%;
      accent-color: #5d9b65;
      cursor: pointer;
    }

    .burn-time input[type="range"]:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .tilt-angle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: min(80vw, 320px);
    }

    .tilt-angle label {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      color: #cfe6d2;
    }

    .tilt-angle input[type="range"] {
      width: 100%;
      accent-color: #5d9b65;
      cursor: pointer;
    }

    .view-angle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: min(80vw, 320px);
    }

    .view-angle label {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      color: #cfe6d2;
    }

    .view-angle input[type="range"] {
      width: 100%;
      accent-color: #5d9b65;
      cursor: pointer;
    }

    @media (max-height: 720px) {
      .stage {
        width: min(60vh, 340px);
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>蚊取り線香</h1>
      <p class="subtitle">静かな夜に、ゆらめく香り</p>
    </header>

    <section class="stage" aria-label="蚊取り線香のアニメーション">
      <div class="glow"></div>
      <canvas id="incenseCanvas"></canvas>
      <div id="smoke" class="smoke"></div>
      <div class="stand"></div>
    </section>

    <div class="status" id="status">火をつけると、外側から燃え始めます</div>

    <div class="smoke-level">
      <label for="smokeLevel">煙の量：<span id="smokeLevelValue">5</span></label>
      <input type="range" id="smokeLevel" min="1" max="10" step="1" value="5" />
    </div>

    <div class="coil-color">
      <label for="coilColor">線香の色</label>
      <input type="color" id="coilColor" value="#315c3a" />
    </div>

    <div class="burn-time">
      <label for="burnTime">燃焼時間（分）：<span id="burnTimeValue">1</span></label>
      <input type="range" id="burnTime" min="1" max="60" step="1" value="1" />
    </div>

    <div class="tilt-angle">
      <label for="tiltAngle">傾ける角度：<span id="tiltAngleValue">0</span>°</label>
      <input type="range" id="tiltAngle" min="0" max="360" step="1" value="0" />
    </div>

    <div class="view-angle">
      <label for="viewAngle">見る角度（真上0°〜真横90°〜180°）：<span id="viewAngleValue">0</span>°</label>
      <input type="range" id="viewAngle" min="0" max="180" step="1" value="0" />
    </div>

    <div class="controls">
      <button id="startButton">火をつける</button>
      <button id="resetButton">リセット</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("incenseCanvas");
    const ctx = canvas.getContext("2d");
    const smoke = document.getElementById("smoke");
    const startButton = document.getElementById("startButton");
    const resetButton = document.getElementById("resetButton");
    const statusText = document.getElementById("status");
    const smokeLevelInput = document.getElementById("smokeLevel");
    const smokeLevelValue = document.getElementById("smokeLevelValue");
    const coilColorInput = document.getElementById("coilColor");
    const burnTimeInput = document.getElementById("burnTime");
    const burnTimeValue = document.getElementById("burnTimeValue");
    const tiltAngleInput = document.getElementById("tiltAngle");
    const tiltAngleValue = document.getElementById("tiltAngleValue");
    const viewAngleInput = document.getElementById("viewAngle");
    const viewAngleValue = document.getElementById("viewAngleValue");
    const stageEl = document.querySelector(".stage");
    const standEl = document.querySelector(".stand");

    let size = 0;
    let animationId = null;
    let running = false;
    let finished = false;
    let burnProgress = 0;
    let smokeLevel = Number(smokeLevelInput.value);
    let smokeTimerId = null;
    let coilColor = coilColorInput.value;

    function hexToRgba(hex, alpha) {
      const clean = hex.replace("#", "");
      const r = parseInt(clean.substring(0, 2), 16);
      const g = parseInt(clean.substring(2, 4), 16);
      const b = parseInt(clean.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // 燃焼時間（ミリ秒）。スライダーで分数を指定できます。
    let BURN_DURATION = Number(burnTimeInput.value) * 60 * 1000;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      size = rect.width;
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      draw();
    }

    function spiralPoint(t) {
      // t = 0 が外側、t = 1 が中心
      const turns = 4.35;
      const startRadius = size * 0.39;
      const endRadius = size * 0.025;
      const radius = startRadius * (1 - t) + endRadius * t;

      // 外側から中心へ向かう渦巻き
      const angle = -Math.PI / 2 - turns * Math.PI * 2 * t;

      return {
        x: size / 2 + Math.cos(angle) * radius,
        y: size / 2 + Math.sin(angle) * radius
      };
    }

    function drawSpiral() {
      const steps = 700;

      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = Math.max(11, size * 0.036);

      // まず全体を暗い緑で描画
      ctx.beginPath();

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const p = spiralPoint(t);

        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }

      ctx.strokeStyle = coilColor;
      ctx.shadowColor = hexToRgba(coilColor, 0.35);
      ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 燃焼済み部分を灰色（灰）で表示
      if (burnProgress > 0) {
        ctx.beginPath();

        for (let i = 0; i <= steps * burnProgress; i++) {
          const t = i / steps;
          const p = spiralPoint(t);

          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }

        ctx.strokeStyle = "#8a8f8c";
        ctx.shadowColor = "rgba(160, 165, 162, 0.35)";
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }

    function drawEmber() {
      if (!running || finished) return;

      const p = spiralPoint(burnProgress);

      const gradient = ctx.createRadialGradient(
        p.x, p.y, 0,
        p.x, p.y, size * 0.07
      );

      gradient.addColorStop(0, "#fff9b0");
      gradient.addColorStop(0.2, "#ffb13b");
      gradient.addColorStop(0.55, "#ff4b32");
      gradient.addColorStop(1, "rgba(255, 55, 30, 0)");

      ctx.beginPath();
      ctx.fillStyle = gradient;
      ctx.arc(p.x, p.y, size * 0.075, 0, Math.PI * 2);
      ctx.fill();

      // 小さな火の粉
      ctx.beginPath();
      ctx.fillStyle = "#ffd36a";
      ctx.arc(
        p.x + Math.sin(Date.now() / 90) * 2,
        p.y - size * 0.025,
        2.2,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, size, size);
      drawSpiral();
      drawEmber();
    }

    function addSmoke() {
      if (!running || finished) return;

      const p = spiralPoint(burnProgress);
      const rect = canvas.getBoundingClientRect();

      const particle = document.createElement("span");
      particle.className = "smoke-particle";

      // Canvas左上を基準に煙を配置
      particle.style.left = `${p.x / size * 100}%`;
      particle.style.top = `${p.y / size * 100}%`;
      particle.style.setProperty(
        "--drift",
        `${(Math.random() - 0.5) * 42}px`
      );
      particle.style.animationDuration = `${2.1 + Math.random() * 1.4}s`;

      smoke.appendChild(particle);

      setTimeout(() => particle.remove(), 3600);
    }

    function animate(now, startTime) {
      if (!running) return;

      burnProgress = Math.min(
        (now - startTime) / BURN_DURATION,
        1
      );

      draw();

      if (burnProgress >= 1) {
        running = false;
        finished = true;
        burnProgress = 1;
        draw();
        statusText.textContent = "静かに燃え尽きました";
        startButton.disabled = true;
        return;
      }

      animationId = requestAnimationFrame((time) => {
        animate(time, startTime);
      });
    }

    startButton.addEventListener("click", () => {
      if (running || finished) return;

      BURN_DURATION = Number(burnTimeInput.value) * 60 * 1000;
      burnTimeInput.disabled = true;

      running = true;
      statusText.textContent = "ゆっくり燃えています…";
      startButton.disabled = true;

      const startTime = performance.now();
      animationId = requestAnimationFrame((time) => {
        animate(time, startTime);
      });
    });

    resetButton.addEventListener("click", () => {
      running = false;
      finished = false;
      burnProgress = 0;

      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }

      smoke.innerHTML = "";
      startButton.disabled = false;
      burnTimeInput.disabled = false;
      statusText.textContent = "火をつけると、外側から燃え始めます";
      draw();
    });

    // 煙を定期的に発生（レベル1〜10で1回あたりの粒数を調整）
    function startSmokeTimer() {
      if (smokeTimerId) clearInterval(smokeTimerId);

      smokeTimerId = setInterval(() => {
        if (running && !finished) {
          for (let i = 0; i < smokeLevel; i++) addSmoke();
        }
      }, 220);
    }

    smokeLevelInput.addEventListener("input", () => {
      smokeLevel = Number(smokeLevelInput.value);
      smokeLevelValue.textContent = smokeLevel;
    });

    coilColorInput.addEventListener("input", () => {
      coilColor = coilColorInput.value;
      draw();
    });

    burnTimeInput.addEventListener("input", () => {
      burnTimeValue.textContent = burnTimeInput.value;
    });

    function updateStageTransform() {
      const angle = Number(tiltAngleInput.value);
      const viewAngle = Number(viewAngleInput.value);
      const squash = 1 - 0.85 * Math.abs(Math.sin((viewAngle * Math.PI) / 180));

      tiltAngleValue.textContent = angle;
      viewAngleValue.textContent = viewAngle;

      stageEl.style.transform = `rotate(${angle}deg) scaleY(${squash})`;
      standEl.style.transform = `rotate(${-angle}deg) scaleY(${squash})`;
    }

    tiltAngleInput.addEventListener("input", updateStageTransform);
    viewAngleInput.addEventListener("input", updateStageTransform);

    startSmokeTimer();

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
