border: none;

<body>
  <main class="app">
    <header>
      <h1>香線り取蚊<span class="mosquito right">🦟</span></h1>
      <p class="subtitle">静かな夜にゆらめく煙り</p>
    </header>

    <section class="stage" aria-label="蚊取り線香のアニメーション">
      <div class="glow"></div>
      <canvas id="incenseCanvas"></canvas>
      <div id="smoke" class="smoke"></div>
      <div class="stand"></div>
    </section>

    <div class="status" id="status">火をつけると、外側から燃え始めます</div>
　　<div class="status" id="remaining"></div>
    <div class="smoke-level">
      <label for="smokeLevel">煙の量：<span id="smokeLevelValue">5</span></label>
      <input type="range" id="smokeLevel" min="1" max="10" step="1" value="5" />
    </div>

    <div class="coil-color">
      <label for="coilColor">線香の色</label>
      <input type="color" id="coilColor" value="#315c3a" />
    </div>

    <div class="burn-time">
      <label for="burnTime">燃焼時間（分）：<span id="burnTimeValue">1</span></label>
      <input type="range" id="burnTime" min="1" max="60" step="1" value="1" />
    </div>

    <div class="tilt-angle">
      <label for="tiltAngle">傾ける角度：<span id="tiltAngleValue">0</span>°</label>
      <input type="range" id="tiltAngle" min="0" max="180" step="1" value="0" />
    </div>

    <div class="view-angle">
      <label for="viewAngle">見る角度（真上0°〜真横90°〜180°）：<span id="viewAngleValue">0</span>°</label>
      <input type="range" id="viewAngle" min="0" max="180" step="1" value="0" />
    </div>

    <div class="controls">
      <button id="startButton">火をつける</button>
      <button id="resetButton">リセット</button>
    </div>
  </main>

  <script>
   const canvas = document.getElementById("incenseCanvas");
    const ctx = canvas.getContext("2d");
    const smoke = document.getElementById("smoke");
    const startButton = document.getElementById("startButton");
    const resetButton = document.getElementById("resetButton");
    const statusText = document.getElementById("status");
    const smokeLevelInput = document.getElementById("smokeLevel");
    const smokeLevelValue = document.getElementById("smokeLevelValue");
    const coilColorInput = document.getElementById("coilColor");
    const burnTimeInput = document.getElementById("burnTime");
    const burnTimeValue = document.getElementById("burnTimeValue");
    const tiltAngleInput = document.getElementById("tiltAngle");
    const tiltAngleValue = document.getElementById("tiltAngleValue");
    const viewAngleInput = document.getElementById("viewAngle");
    const viewAngleValue = document.getElementById("viewAngleValue");
    const stageEl = document.querySelector(".stage");
    const standEl = document.querySelector(".stand");

    let size = 0;
    let animationId = null;
    let running = false;
    let finished = false;
    let burnProgress = 0;
    let smokeLevel = Number(smokeLevelInput.value);
    let smokeTimerId = null;
    let coilColor = coilColorInput.value;
    let viewTiltFactor = 0;
    let doorTiltFactor = 0;

    function hexToRgba(hex, alpha) {
      const clean = hex.replace("#", "");
      const r = parseInt(clean.substring(0, 2), 16);
      const g = parseInt(clean.substring(2, 4), 16);
      const b = parseInt(clean.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function shadeColor(hex, percent) {
      const clean = hex.replace("#", "");
      let r = parseInt(clean.substring(0, 2), 16);
      let g = parseInt(clean.substring(2, 4), 16);
      let b = parseInt(clean.substring(4, 6), 16);
      r = Math.min(255, Math.max(0, Math.round(r + (percent / 100) * 255)));
      g = Math.min(255, Math.max(0, Math.round(g + (percent / 100) * 255)));
      b = Math.min(255, Math.max(0, Math.round(b + (percent / 100) * 255)));
      return `rgb(${r}, ${g}, ${b})`;
    }

    // 燃焼時間（ミリ秒）。スライダーで分数を指定できます。
    let BURN_DURATION = Number(burnTimeInput.value) * 60 * 1000;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      size = rect.width;
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      draw();
    }

    function spiralPoint(t) {
      // t = 0 が外側、t = 1 が中心
      const turns = 4.35;
      const startRadius = size * 0.39;
      const endRadius = size * 0.025;
      const radius = startRadius * (1 - t) + endRadius * t;

      // 外側から中心へ向かう渦巻き
      const angle = -Math.PI / 2 - turns * Math.PI * 2 * t;

      return {
        x: size / 2 + Math.cos(angle) * radius,
        y: size / 2 + Math.sin(angle) * radius
      };
    }

    function drawSpiral() {
      const steps = 700;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      const baseWidth = Math.max(14, size * 0.060);
      const offset = Math.max(2, size * 0.012);
      const coilThickness = size * 0.12;
      const extrusionY = coilThickness * viewTiltFactor;
      const extrusionX = coilThickness * doorTiltFactor;

      // 側面（見る角度で厚みが出る部分・上下）
      if (extrusionY > 0.5) {
        ctx.lineWidth = baseWidth;
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const p = spiralPoint(t);
          if (i === 0) ctx.moveTo(p.x, p.y + extrusionY);
          else ctx.lineTo(p.x, p.y + extrusionY);
        }
        ctx.strokeStyle = shadeColor(coilColor, -40);
        ctx.stroke();
      }

      // 側面（傾ける角度で厚みが出る部分・左右）
      if (extrusionX > 0.5) {
        ctx.lineWidth = baseWidth;
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const p = spiralPoint(t);
          if (i === 0) ctx.moveTo(p.x + extrusionX, p.y);
          else ctx.lineTo(p.x + extrusionX, p.y);
        }
        ctx.strokeStyle = shadeColor(coilColor, -40);
        ctx.stroke();
      }

      // 影（奥行き）
      ctx.lineWidth = baseWidth;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const p = spiralPoint(t);
        if (i === 0) ctx.moveTo(p.x + offset, p.y + offset);
        else ctx.lineTo(p.x + offset, p.y + offset);
      }
      ctx.strokeStyle = shadeColor(coilColor, -40);
      ctx.stroke();

      // 本体
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const p = spiralPoint(t);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = coilColor;
      ctx.shadowColor = hexToRgba(coilColor, 0.35);
      ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // ハイライト（光の反射）
      ctx.lineWidth = baseWidth * 0.38;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const p = spiralPoint(t);
        if (i === 0) ctx.moveTo(p.x - offset, p.y - offset);
        else ctx.lineTo(p.x - offset, p.y - offset);
      }
      ctx.strokeStyle = shadeColor(coilColor, 40);
      ctx.stroke();
      ctx.lineWidth = baseWidth;

            // 燃焼済み部分を灰で表示（リアルな灰の質感）
      if (burnProgress > 0) {
        const burnSteps = Math.floor(steps * burnProgress);

        // 灰の本体（暖かみのある薄いグレー）
        ctx.lineWidth = baseWidth * 0.92;
        ctx.beginPath();
        for (let i = 0; i <= burnSteps; i++) {
          const t = i / steps;
          const p = spiralPoint(t);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = "#b9b4aa";
        ctx.shadowColor = "rgba(60, 55, 50, 0.45)";
        ctx.shadowBlur = 6;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // 灰の中心（焦げた暗い芯）
        ctx.lineWidth = baseWidth * 0.3;
        ctx.beginPath();
        for (let i = 0; i <= burnSteps; i++) {
          const t = i / steps;
          const p = spiralPoint(t);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = "#5e5953";
        ctx.stroke();

        ctx.lineWidth = baseWidth;
      }
    }

    function drawEmber() {
      if (!running || finished) return;

      const p = spiralPoint(burnProgress);

      const gradient = ctx.createRadialGradient(
        p.x, p.y, 0,
        p.x, p.y, size * 0.07
      );

      gradient.addColorStop(0, "#fff9b0");
      gradient.addColorStop(0.2, "#ffb13b");
      gradient.addColorStop(0.55, "#ff4b32");
      gradient.addColorStop(1, "rgba(255, 55, 30, 0)");

      ctx.beginPath();
      ctx.fillStyle = gradient;
      ctx.arc(p.x, p.y, size * 0.075, 0, Math.PI * 2);
      ctx.fill();

      // 小さな火の粉
      ctx.beginPath();
      ctx.fillStyle = "#ffd36a";
      ctx.arc(
        p.x + Math.sin(Date.now() / 90) * 2,
        p.y - size * 0.025,
        2.2,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, size, size);
      drawSpiral();
      drawEmber();
    }

    function addSmoke() {
      if (!running || finished) return;

      const p = spiralPoint(burnProgress);
      const rect = canvas.getBoundingClientRect();

      const particle = document.createElement("span");
      particle.className = "smoke-particle";

      // Canvas左上を基準に煙を配置
      particle.style.left = `${p.x / size * 100}%`;
      particle.style.top = `${p.y / size * 100}%`;
      particle.style.setProperty(
        "--drift",
        `${(Math.random() - 0.5) * 18}px`
      );
      particle.style.animationDuration = `${2.1 + Math.random() * 1.4}s`;

      smoke.appendChild(particle);

      setTimeout(() => particle.remove(), 3600);
    }
        function playChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ac = new AudioCtx();
        const master = ac.createGain();
        master.gain.value = 0.9;
        master.connect(ac.destination);

        // おりんの響き：基音と、わずかにずれた倍音を重ねる
        const partials = [
          { f: 1046, g: 0.50, d: 7.0 },
          { f: 2093, g: 0.22, d: 5.0 },
          { f: 2860, g: 0.15, d: 3.5 },
          { f: 4180, g: 0.08, d: 2.2 },
          { f: 1052, g: 0.35, d: 7.5 } // 唸り（うなり）を作る
        ];

        const strike = (t0, volume) => {
          partials.forEach((p) => {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = "sine";
            osc.frequency.value = p.f;
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(p.g * volume, t0 + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.0008, t0 + p.d);
            osc.connect(gain).connect(master);
            osc.start(t0);
            osc.stop(t0 + p.d + 0.1);
          });
        };

        const now = ac.currentTime;
        strike(now, 1.0);        // 一回目
      } catch (e) {}
    }
    function animate(now, startTime) {
      if (!running) return;

            burnProgress = Math.min(
        (now - startTime) / BURN_DURATION,
        1
      );

      const remainMs = Math.max(0, BURN_DURATION * (1 - burnProgress));
      const remainSec = Math.ceil(remainMs / 1000);
      const mm = String(Math.floor(remainSec / 60)).padStart(2, "0");
      const ss = String(remainSec % 60).padStart(2, "0");
      document.getElementById("remaining").textContent = `残り ${mm}:${ss}`;

      draw();

      if (burnProgress >= 1) {
        running = false;
        finished = true;
        burnProgress = 1;
        draw();
                statusText.textContent = "静かに燃え尽きました";
        document.getElementById("remaining").textContent = "残り 00:00";
        startButton.disabled = true;
        if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 600]);
        playChime();
        return;
      }

      animationId = requestAnimationFrame((time) => {
        animate(time, startTime);
      });
    }

    startButton.addEventListener("click", () => {
      if (running || finished) return;

      BURN_DURATION = Number(burnTimeInput.value) * 60 * 1000;
      burnTimeInput.disabled = true;

      running = true;
      statusText.textContent = "ゆっくり燃えています…";
      startButton.disabled = true;

      const startTime = performance.now();
      animationId = requestAnimationFrame((time) => {
        animate(time, startTime);
      });
    });

    resetButton.addEventListener("click", () => {
  running = false;
  finished = false;
  burnProgress = 0;

  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

    coilColor = "#315c3a";
  coilColorInput.value = "#315c3a";

    tiltAngleInput.value = 0;
  viewAngleInput.value = 0;
  updateStageTransform();

  smokeLevelInput.value = 1;
  smokeLevel = 1;
  smokeLevelValue.textContent = 1;

  burnTimeInput.value = 1;
  burnTimeValue.textContent = 1;
  BURN_DURATION = 60 * 1000;

  smoke.innerHTML = "";
  document.getElementById("remaining").textContent = "";
  startButton.disabled = false;
  burnTimeInput.disabled = false;
  statusText.textContent = "火をつけると、外側から燃え始めます";
  draw();
});

    // 煙を定期的に発生（レベル1〜10で1回あたりの粒数を調整）
    function startSmokeTimer() {
      if (smokeTimerId) clearInterval(smokeTimerId);

      smokeTimerId = setInterval(() => {
        if (running && !finished) {
          for (let i = 0; i < smokeLevel; i++) addSmoke();
        }
      }, 220);
    }

    smokeLevelInput.addEventListener("input", () => {
      smokeLevel = Number(smokeLevelInput.value);
      smokeLevelValue.textContent = smokeLevel;
    });

    coilColorInput.addEventListener("input", () => {
      coilColor = coilColorInput.value;
      draw();
    });

    burnTimeInput.addEventListener("input", () => {
      burnTimeValue.textContent = burnTimeInput.value;
    });

    function updateStageTransform() {
  const sliderAngle = Number(tiltAngleInput.value);
  const angle = sliderAngle <= 90
    ? Math.min(sliderAngle, 82)
    : Math.max(sliderAngle, 98);
  const viewAngle = Number(viewAngleInput.value);
  const squash = 1 - 0.85 * Math.abs(Math.sin((viewAngle * Math.PI) / 180));
  viewTiltFactor = Math.abs(Math.sin((viewAngle * Math.PI) / 180));
  viewTiltFactor = Math.abs(Math.sin((viewAngle * Math.PI) / 180));
  doorTiltFactor = Math.abs(Math.sin((angle * Math.PI) / 180));

  tiltAngleValue.textContent = sliderAngle;
  viewAngleValue.textContent = viewAngle;

    const widthCompensation = Math.min(1.6, 1 / Math.max(0.12, Math.abs(Math.cos((angle * Math.PI) / 180))));
  stageEl.style.transform = `scaleX(${widthCompensation}) rotateY(${angle}deg) scaleY(${squash})`;
  standEl.style.transform = `scaleX(${widthCompensation}) rotateY(${-angle}deg) scaleY(${squash})`;

  draw();
}
    

    tiltAngleInput.addEventListener("input", updateStageTransform);
    viewAngleInput.addEventListener("input", updateStageTransform);

    startSmokeTimer();

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    // ===== 燃えた後にダブルタップで粉々 =====
(function () {
  const canvas = document.getElementById('incenseCanvas');
  const stage = canvas.parentElement;
  const resetBtn = document.getElementById('resetButton');
  const startBtn = document.getElementById('startButton');
  let burnedOut = false;
  let shattered = false;
  let pieces = [];

  // 燃え尽きた合図（おりんが鳴るタイミング）を拾う
  try {
    const orig = playChime;
    playChime = function () {
      burnedOut = true;
      return orig.apply(this, arguments);
    };
  } catch (e) {}

  function restore() {
    pieces.forEach(function (p) { p.remove(); });
    pieces = [];
    canvas.style.visibility = '';
    shattered = false;
  }
  resetBtn.addEventListener('click', function () { burnedOut = false; restore(); });
  startBtn.addEventListener('click', function () { burnedOut = false; restore(); });

  function crumble() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      const len = Math.floor(ctx.sampleRate * 0.5);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2) * (Math.random() < 0.15 ? 1 : 0.25);
      }
      const s = ctx.createBufferSource();
      s.buffer = buf;
      const f = ctx.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 1200;
      const g = ctx.createGain();
      g.gain.value = 0.25;
      s.connect(f); f.connect(g); g.connect(ctx.destination);
      s.start();
      setTimeout(function () { ctx.close(); }, 800);
    } catch (e) {}
  }

  function shatter() {
    shattered = true;
    const ctx2d = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const dw = canvas.offsetWidth, dh = canvas.offsetHeight;
    const cols = 10, rows = 10;
    const tw = Math.ceil(W / cols), th = Math.ceil(H / rows);
    const kx = dw / W, ky = dh / H;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const sx = c * tw, sy = r * th;
        const w = Math.min(tw, W - sx), h = Math.min(th, H - sy);
        if (w <= 0 || h <= 0) continue;
        // 何も描かれていない欠片は作らない
        const data = ctx2d.getImageData(sx, sy, w, h).data;
        let has = false;
        for (let i = 3; i < data.length; i += 4) { if (data[i] > 10) { has = true; break; } }
        if (!has) continue;

        const piece = document.createElement('canvas');
        piece.width = w; piece.height = h;
        piece.getContext('2d').drawImage(canvas, sx, sy, w, h, 0, 0, w, h);
        piece.style.cssText =
          'position:absolute;pointer-events:none;z-index:5;' +
          'left:' + (canvas.offsetLeft + sx * kx) + 'px;' +
          'top:' + (canvas.offsetTop + sy * ky) + 'px;' +
          'width:' + (w * kx) + 'px;height:' + (h * ky) + 'px;';
        stage.appendChild(piece);
        pieces.push(piece);

        const fromCenterX = (sx + w / 2) / W - 0.5;
        const dx = fromCenterX * 260 + (Math.random() - 0.5) * 120;
        const dy = 90 + Math.random() * 260;
        const rot = (Math.random() - 0.5) * 540;
        const anim = piece.animate([
          { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1 },
          { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg) scale(0.6)', opacity: 0 }
        ], {
          duration: 900 + Math.random() * 700,
          easing: 'cubic-bezier(.2,.6,.4,1)',
          fill: 'forwards'
        });
        anim.onfinish = function () { piece.remove(); };
      }
    }
    canvas.style.visibility = 'hidden';
    crumble();
  }

  // ダブルタップ判定
  let lastTime = 0, lastX = 0, lastY = 0;
  stage.style.touchAction = 'manipulation';
  stage.addEventListener('pointerup', function (e) {
    const now = Date.now();
    const near = Math.hypot(e.clientX - lastX, e.clientY - lastY) < 40;
    if (now - lastTime < 350 && near) {
      lastTime = 0;
      if (burnedOut && !shattered) shatter();
    } else {
      lastTime = now;
      lastX = e.clientX;
      lastY = e.clientY;
    }
  });
})();
    // ===== 見る角度で縮んだ分、煙の上昇距離を補正 =====
(function () {
  const smokeEl = document.getElementById('smoke');
  function update() {
    let k = 1;
    let el = smokeEl.parentElement;
    while (el && el !== document.documentElement) {
      const t = getComputedStyle(el).transform;
      if (t && t !== 'none') {
        const v = t.match(/matrix3?d?\(([^)]+)\)/);
        if (v) {
          const m = v[1].split(',').map(parseFloat);
          // Y軸方向の長さ（縦の縮み具合）
          const len = m.length === 6
            ? Math.hypot(m[2], m[3])
            : Math.hypot(m[4], m[5], m[6]);
          k *= len;
        }
      }
      el = el.parentElement;
    }
    const comp = Math.min(2.5, 1 / Math.max(0.12, k));
    document.documentElement.style.setProperty('--rise-comp', comp.toFixed(2));
  }
  setInterval(update, 150);
  update();
})();
